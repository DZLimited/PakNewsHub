<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PakNewsHub — international news for Pakistan, in English and Urdu." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>PakNewsHub</title>
    <!-- Apply saved theme + language before React loads, so a dark-mode or
         Urdu reader doesn't see a flash of the light/LTR page. -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.classList.add(t);
        if (localStorage.getItem('lang') === 'ur') {
          document.documentElement.lang = 'ur';
          document.documentElement.dir = 'rtl';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
